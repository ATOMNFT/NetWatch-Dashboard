name: Publish NetWatch v1.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        env:
          SETTINGS_DIR: /tmp/netwatch-release-ci
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --check static/js/app.js
          node --check static/js/guardian.js
      - name: Check dependency advisories
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Build versioned Docker image
        run: |
          docker build -t ghcr.io/atomnft/netwatch-dashboard:1.1.0 -t ghcr.io/atomnft/netwatch-dashboard:latest .
      - name: Publish GitHub release and v1.1.0 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists; not overwriting."
          else
            gh release create v1.1.0 --target "$GITHUB_SHA" \
              --title "NetWatch-Dashboard v1.1.0 — Network Guardian" \
              --notes-file docs/releases/v1.1.0.md
          fi
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push versioned and latest Docker tags
        run: |
          docker push ghcr.io/atomnft/netwatch-dashboard:1.1.0
          docker push ghcr.io/atomnft/netwatch-dashboard:latest
