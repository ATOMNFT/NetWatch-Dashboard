services:
  netwatch:
    container_name: netwatch-dashboard
    image: ghcr.io/atomnft/netwatch-dashboard:latest
    environment:
      - DEFAULT_SCAN_TARGET=192.168.1.0/24
      - DEFAULT_TOP_PORTS=200
      - APP_PORT=4998
      - SETTINGS_DIR=/app/data
      # Optional: set NETWATCH_PASSWORD in a local .env to require login
      - NETWATCH_USERNAME=${NETWATCH_USERNAME:-admin}
      - NETWATCH_PASSWORD=${NETWATCH_PASSWORD:-}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; port=os.getenv('APP_PORT','4998'); urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s